<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Product simulation</title>
<link rel="icon" href="data:,">
<style>
  body { margin:0; font-family:system-ui,sans-serif; background:#0b1220; color:#e6edf5; }
  main { max-width:64rem; margin:0 auto; padding:1rem; display:grid; gap:1rem; }
  #frame { position:relative; width:100%; aspect-ratio:16/10; background:#101a2b; border-radius:.75rem; overflow:hidden; }
  #unity { width:100%; height:100%; display:block; }
  #bar { position:absolute; left:10%; right:10%; bottom:45%; height:.5rem; background:#2a3a52; border-radius:1rem; overflow:hidden; }
  #bar > div { height:100%; width:0; background:#4cc9f0; }
  #msg { padding:1rem; display:none; }
  .row { display:flex; flex-wrap:wrap; gap:.75rem; align-items:center; }
  button { min-height:2.75rem; min-width:2.75rem; padding:0 1rem; border:0; border-radius:.5rem; background:#4cc9f0; color:#04263a; font-weight:600; cursor:pointer; }
  input[type=range] { min-height:2.75rem; flex:1 1 12rem; accent-color:#4cc9f0; }
  button:focus-visible, input:focus-visible { outline:2px solid #fff; outline-offset:2px; }
</style>
</head>
<body>
<main>
  <div id="frame">
    <canvas id="unity" role="img" aria-label="Interactive 3D product simulation"></canvas>
    <div id="bar" role="progressbar" aria-label="Loading"><div id="fill"></div></div>
    <p id="msg">The 3D view could not start in this browser. Please try another browser or device.</p>
  </div>
  <div class="row">
    <button id="power" type="button" aria-pressed="false">Power</button>
    <label for="speed">Speed</label>
    <input id="speed" type="range" min="0.1" max="1" step="0.05" value="0.5">
    <span id="evt" aria-live="polite"></span>
  </div>
</main>
<script>
  // Edit these to match your build's file names (Unity names them after the build or product name).
  var BUILD = 'Build', NAME = 'WebGL';
  var cfg = {
    dataUrl: BUILD + '/' + NAME + '.data',          // add .br or .gz if you serve compressed files with the right headers
    frameworkUrl: BUILD + '/' + NAME + '.framework.js',
    codeUrl: BUILD + '/' + NAME + '.wasm',
    streamingAssetsUrl: 'StreamingAssets',
    companyName: 'Studio', productName: 'Product simulation', productVersion: '1.0',
    devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
  };
  var unity = null, on = false;
  window.onUnityEvent = function (name, payload) { document.getElementById('evt').textContent = name + ': ' + payload; };

  var s = document.createElement('script');
  s.src = BUILD + '/' + NAME + '.loader.js';
  s.onload = function () {
    createUnityInstance(document.getElementById('unity'), cfg, function (p) {
      document.getElementById('fill').style.width = (p * 100) + '%';
    }).then(function (inst) {
      unity = inst; document.getElementById('bar').style.display = 'none';
    }).catch(function () { document.getElementById('msg').style.display = 'block'; document.getElementById('bar').style.display = 'none'; });
  };
  s.onerror = function () { document.getElementById('msg').style.display = 'block'; };
  document.body.appendChild(s);

  document.getElementById('power').addEventListener('click', function (e) {
    on = !on; e.currentTarget.setAttribute('aria-pressed', String(on));
    if (unity) unity.SendMessage('WebBridge', 'SetPower', on ? 1 : 0);
  });
  document.getElementById('speed').addEventListener('input', function (e) {
    if (unity) unity.SendMessage('WebBridge', 'SetSpeed', Number(e.target.value));
  });
</script>
</body>
</html>
