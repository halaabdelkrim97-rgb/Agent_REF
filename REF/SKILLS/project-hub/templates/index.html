<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Hub</title>
<style>
/* Forge Project Hub. Static page: never edit it per project. Project content lives in hub-data.js. */
:root{--primary:#4f46e5;--accent:#f59e0b;--bg:#f6f7fb;--card:#fff;--text:#161a2b;--muted:#5d647a;--line:#e3e6f0;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--r:14px}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1020;--card:#171a30;--text:#eceefb;--muted:#9aa1bd;--line:#272b49}}
:root[data-theme=dark]{--bg:#0e1020;--card:#171a30;--text:#eceefb;--muted:#9aa1bd;--line:#272b49}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1140px;margin:0 auto;padding:0 16px 48px}
header.hero{background:linear-gradient(135deg,var(--primary),color-mix(in srgb,var(--primary) 55%,var(--accent)));color:#fff;padding:30px 0 26px}
.hero h1{margin:0 0 4px;font-size:clamp(1.6rem,4vw,2.4rem);line-height:1.15}
.hero p{margin:0;opacity:.92;max-width:62ch}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);border-radius:99px;padding:3px 12px;font-size:.82rem}
nav.tabs{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:4px;overflow-x:auto;padding:8px 16px;margin:0 -16px 20px}
nav.tabs button{border:0;background:none;color:var(--muted);font:inherit;font-weight:600;padding:8px 14px;border-radius:99px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected=true]{background:var(--primary);color:#fff}
nav.tabs .n{display:inline-block;min-width:20px;margin-left:6px;padding:0 6px;border-radius:99px;background:var(--bad);color:#fff;font-size:.72rem;line-height:20px;text-align:center}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.theme{margin-left:auto;border:1px solid var(--line)!important;background:var(--card)!important;color:var(--text)!important}
section.panel[hidden]{display:none}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.grid+.grid,.card+.grid,.grid+.card{margin-top:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card h2,.card h3{margin:0 0 10px;font-size:1.05rem}
.muted{color:var(--muted)}
.kpi{font-size:2rem;font-weight:800;line-height:1}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:99px}
.row{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.badge{display:inline-block;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 9px;border-radius:99px;background:var(--line);color:var(--muted)}
.badge.done,.badge.low,.badge.nice{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.badge.doing,.badge.medium,.badge.important{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.badge.high,.badge.blocker{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad)}
.badge.used{background:color-mix(in srgb,var(--primary) 20%,transparent);color:var(--primary)}
.timeline{position:relative;margin:0;padding:0 0 0 22px;list-style:none;border-left:3px solid var(--line)}
.timeline li{position:relative;margin:0 0 18px}
.timeline li::before{content:"";position:absolute;left:-30px;top:6px;width:13px;height:13px;border-radius:50%;background:var(--line);border:3px solid var(--bg)}
.timeline li.done::before{background:var(--ok)}.timeline li.doing::before{background:var(--accent)}
ul.tasks,ul.plain{list-style:none;margin:8px 0 0;padding:0}
ul.tasks li{padding:2px 0}ul.tasks li.done{color:var(--muted);text-decoration:line-through}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--line);margin-right:8px}
.dot.done{background:var(--ok)}.dot.doing{background:var(--accent)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.sw{display:flex;gap:12px;flex-wrap:wrap}.sw div{width:104px}.sw b{display:block;height:56px;border-radius:10px;border:1px solid var(--line)}.sw small{display:block;color:var(--muted)}
.todo{color:var(--muted);font-style:italic}
a{color:var(--primary)}
.btn{border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-weight:600;padding:8px 14px;border-radius:10px;cursor:pointer}
.btn.pri{background:var(--primary);border-color:var(--primary);color:#fff}
.btn.sm{padding:5px 10px;font-size:.85rem}
.board{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.col{background:color-mix(in srgb,var(--line) 40%,transparent);border-radius:var(--r);padding:12px}
.col h3{margin:0 0 10px;font-size:.9rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.ticket{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px}
.ticket.high{border-left-color:var(--bad)}.ticket.medium{border-left-color:var(--warn)}.ticket.low{border-left-color:var(--ok)}
.tracktag{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:10px;color:#fff;font-weight:800;margin-right:10px;background:var(--primary)}
.tcard.off{opacity:.55}
.gap{border-left:5px solid var(--line)}.gap.blocker{border-left-color:var(--bad)}.gap.important{border-left-color:var(--warn)}.gap.nice{border-left-color:var(--ok)}.gap.decided{border-left-color:var(--primary)}
.opts{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin:12px 0}
.opt{text-align:left;border:2px solid var(--line);background:var(--bg);color:var(--text);font:inherit;border-radius:12px;padding:10px 12px;cursor:pointer}
.opt[aria-pressed=true]{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 12%,var(--card))}
.opt b{display:block}.opt small{color:var(--muted)}
.opt .rec{float:right;font-size:.7rem;font-weight:700;color:var(--ok);text-transform:uppercase}
input[type=text],input[type=search]{width:100%;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.filters .btn[aria-pressed=true]{background:var(--text);color:var(--bg);border-color:var(--text)}
.sk{display:flex;gap:10px;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}
.sk code{font-weight:700;white-space:nowrap}.sk span{color:var(--muted);font-size:.9rem}
.sk.used code{color:var(--primary)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
dialog{border:1px solid var(--line);border-radius:var(--r);background:var(--card);color:var(--text);max-width:640px;width:calc(100% - 32px)}
dialog textarea{width:100%;font:inherit;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px}
footer{margin-top:28px;color:var(--muted);font-size:.85rem}
@media (max-width:600px){.hero{padding:22px 0}.kpi{font-size:1.6rem}}
@media print{nav.tabs,.theme,.btn,.filters{display:none}section.panel[hidden]{display:block}.card{break-inside:avoid}}
</style>
</head>
<body>
<header class="hero"><div class="wrap"><h1 id="pname"></h1><p id="ptag"></p><div class="chips" id="chips"></div></div></header>
<div class="wrap">
  <nav class="tabs" role="tablist" id="tabs"></nav>
  <main id="main"></main>
  <footer id="foot"></footer>
</div>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="dlg"><p>Select all and copy this text, then paste it into Forge:</p><textarea id="dlgt" rows="10" readonly></textarea><p><button class="btn" id="dlgx">Close</button></p></dialog>

<script src="hub-data.js"></script>
<script>
/*SKILLS:BEGIN*/
const FORGE = {"version": "v2.4.0", "groups": [
{"g": "Planning & Process", "skills": [["brainstorming", "You MUST use this before any creative work - creating features, building components, adding functionality, or modifying…"], ["writing-plans", "Use when you have an approved spec or requirements for a multi-step task, before touching code."]]},
{"g": "Engineering", "skills": [["backend-architect", "Backend and API architecture: REST, GraphQL and gRPC design, service boundaries, event-driven patterns, resilience and…"], ["frontend-developer", "Frontend component, responsive layout, client-side state, performance and accessibility guidance."], ["ui-components-21st", "Use 21st.dev (Magic MCP and 21st-dev CLI) to find or generate UI components from a prompt."], ["coding-standards", "Coding standards and best practices for JavaScript, plus TypeScript, React and Node.js where the project already uses t…"], ["debugging", "Root-cause debugging procedure - reproduce, isolate, form ranked hypotheses, gather evidence, apply the smallest fix an…"], ["git-workflow", "Git habits for clean history - branches, small commits, version-prefixed messages, safe pushes, pull requests, changelo…"]]},
{"g": "UI, Motion & Visuals", "skills": [["ui-ux-pro-max", "Comprehensive design guide for web and mobile applications."], ["baseline-ui", "Quickly deslop UI code by fixing spacing, hierarchy, typography, and small layout issues."], ["scroll-experience", "Scroll-driven web experiences: parallax storytelling, scroll animations, interactive narratives and cinematic pages, us…"], ["css-motion", "Plain CSS and Web Animations motion: transitions, keyframes, scroll-driven animation, FLIP, micro-interactions, easing…"], ["framer-motion", "Motion (formerly Framer Motion) for React projects: motion components, variants, gestures, AnimatePresence exit animati…"], ["gsap", "GSAP (GreenSock) animation: tweens, timelines, easing, ScrollTrigger, stagger, SVG and text effects, React cleanup with…"], ["art-svg-canvas", "Illustrations, icons, patterns, generative art, backgrounds and simple image assets in plain SVG, CSS and Canvas, with…"], ["canvas-design", "Creates original static visual art (poster, cover, art piece) as a single .png or .pdf, guided by a short written desig…"], ["nano-banana", "Generates and edits raster images (hero art, mockups, icons, textures, product shots) with Google's Nano Banana image m…"], ["data-and-charts", "Charts, KPIs and small dashboards for client sites in plain SVG or Canvas - chart choice, scales, labels, accessible co…"], ["accessibility", "WCAG 2.2 AA accessibility checks and fixes for web pages and interactive tools - keyboard, focus, names, contrast, form…"]]},
{"g": "3D & Simulation", "skills": [["threejs", "Three.js API reference: scenes, cameras, renderer, geometry, materials, textures, lighting, shadows, animation, raycast…"], ["3d-scene-builder", "Process for art-directed, game-like 3D product demos on client websites: brief, art direction, blockout, materials, lig…"], ["web-3d-assets", "Turning CAD or 3D models into fast web assets - glTF export, cleanup, PBR materials, texture sizes, compression, HDRI a…"], ["interactive-simulation", "Model, state, fixed-timestep loop, physics basics, controls and delivery for 2D (Canvas or SVG) simulations, product de…"], ["unity-scene-builder", "Unity scenes for web delivery - scene-as-code editor scripts, orbit camera, hotspots, simulation scripts, WebGL build s…"]]},
{"g": "Quality & Delivery", "skills": [["testing", "Plans and runs tests for plain HTML, CSS and JavaScript projects - manual browser checklists first, then simple native…"], ["security-review", "Security checklist review for web code and static sites - secrets, input handling and XSS, forms and CSRF, headers, thi…"], ["seo-performance", "Search visibility and page speed for client websites - semantic HTML, titles, metadata, structured data, sitemap, image…"], ["i18n-forms", "Multilingual pages and reliable web forms: lang and RTL, text files, Intl formatting, language switcher, labels, valida…"], ["client-delivery", "Freelance client project flow - discovery brief, scope and acceptance criteria, milestones, change requests, final chec…"]]},
{"g": "Docs & Memory", "skills": [["project-hub", "Builds and updates the Project Hub, a visually rich HTML page (published as an artifact when the tool exists) with proj…"], ["doc-writer", "Writes and updates project documentation from the real code - README, setup and run steps, specs, handover notes, chang…"], ["reflect", "End-of-day and end-of-session self-improvement: reviews the session or today for corrections, approvals and token waste…"]]},
{"g": "Mechatronics", "skills": [["cad-firmware", "Mechatronics help: parametric CAD and printable parts, Arduino/ESP32/STM32 C++ habits, pin maps, wiring and BOM docs, h…"]]},
{"g": "Agents & Skill Authoring", "skills": [["agent-builder", "Builds a complete task-specific AI agent: mission, identity, scope, rules, tools, skills, memory, reports and tests, cr…"], ["writing-skills", "Use when creating, updating, testing or improving agent skills (SKILL.md files)."], ["writing-great-skills", "Reference for writing and editing skills well: the vocabulary and principles that make a skill predictable."], ["writing-guidelines", "Reviews files for compliance with Vercel's Writing Guidelines."]]}
]};
/*SKILLS:END*/

if (typeof HUB === "undefined") { document.body.innerHTML = '<p style="padding:24px;font:16px system-ui">hub-data.js was not found next to this page. Keep both files together, or use the single-file version.</p>'; throw new Error("HUB missing"); }

const $ = (s, r = document) => r.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const TODO = '<span class="todo">to define</span>';
const val = v => (v === "" || v == null) ? TODO : esc(v);
const money = n => n == null || n === "" || isNaN(n) ? TODO : new Intl.NumberFormat(undefined, { style: "currency", currency: (HUB.business || {}).currency || "EUR", maximumFractionDigits: 0 }).format(n);
const safeUrl = u => /^https?:\/\//i.test(u) ? esc(u) : "#";
const safeColor = c => /^#[0-9a-f]{3,8}$/i.test(c || "") ? c : null;
const badge = s => `<span class="badge ${esc(s)}">${esc(s)}</span>`;
const arr = a => Array.isArray(a) ? a : [];
const chips = a => arr(a).length ? arr(a).map(s => `<span class="badge">${esc(s)}</span> `).join("") : TODO;
const bullets = (a, empty) => arr(a).length ? `<ul>${arr(a).map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : `<p>${empty || TODO}</p>`;

const P = HUB.project || {}, C = HUB.context || {}, D = HUB.plan || {}, B = HUB.business || {}, I = HUB.identity || {}, A = HUB.agent || {};
const phases = arr(D.phases), actions = arr(D.actions), tracks = arr(HUB.tracks);
const pct = phases.length ? Math.round(phases.reduce((a, p) => a + (p.status === "done" ? 100 : +p.progress || 0), 0) / phases.length) : 0;

/* ---------- brand ---------- */
const root = document.documentElement.style;
arr(I.palette).forEach(c => { const h = safeColor(c.hex); if (!h) return; const r = (c.role || "").toLowerCase(); if (r.includes("primary")) root.setProperty("--primary", h); else if (r.includes("accent")) root.setProperty("--accent", h); });
if (I.fonts && I.fonts.body) document.body.style.fontFamily = I.fonts.body + ", system-ui, sans-serif";
document.title = (P.name || "Project") + " - Hub";
$("#pname").textContent = P.name || "Project";
$("#ptag").textContent = P.tagline || P.goal || "";
$("#chips").innerHTML = [P.client && "Client: " + P.client, P.status && "Status: " + P.status, P.version && "Version " + P.version, P.updated && "Updated " + P.updated].filter(Boolean).map(t => `<span class="chip">${esc(t)}</span>`).join("");

/* ---------- gaps (explicit + automatic) ---------- */
const AUTO = [
  ["project", "What is the one-sentence goal of this project?", () => !P.goal, "blocker"],
  ["context", "Who are the users and what problem does the project solve?", () => !(C.users || C.problem), "blocker"],
  ["context", "What is in scope, and what is out of scope, for the first version?", () => !(C.scope && arr(C.scope.in).length), "important"],
  ["context", "Which constraints apply (budget, deadline, devices, standards)?", () => !arr(C.constraints).length, "important"],
  ["project", "Which stack and tools are used or allowed?", () => !arr(P.stack).length, "important"],
  ["tracks", "Which tracks does the project need (hardware, firmware, backend, frontend) and who owns each?", () => !tracks.length, "important"],
  ["plan", "What are the phases and dates of the dev plan?", () => !phases.length, "important"],
  ["plan", "What are the first concrete actions for this week?", () => !actions.length, "important"],
  ["business", "Who pays, for what, and how (revenue model)?", () => !(B.model || B.audience), "important"],
  ["business", "What is the price or budget, and what are the main costs?", () => !arr(B.offer).length || !arr(B.costs).length, "important"],
  ["business", "How is success measured (KPIs)?", () => !arr(B.kpis).length, "nice"],
  ["identity", "What are the brand colors, fonts and tone (or reference sites)?", () => !arr(I.palette).length, "nice"]
];
const autoOpen = AUTO.map((g, i) => ({ id: "M" + (i + 1), area: g[0], question: g[1], priority: g[3], auto: true, open: g[2]() })).filter(g => g.open);
const gaps = [...arr(HUB.gaps), ...autoOpen];
const completeness = Math.round((AUTO.length - autoOpen.length) / AUTO.length * 100);

const KEY = "forgehub:" + (P.name || "project");
let st = {}; try { st = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch (e) { st = {}; }
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch (e) { } };
const decisionOf = g => { const s = st[g.id] || {}; if (s.text) return s.text; if (s.choice != null && arr(g.options)[s.choice]) return arr(g.options)[s.choice].label; return g.status === "decided" ? (g.decision || "decided") : ""; };
const isDecided = g => !!decisionOf(g);
let gapFilter = "open"; const touched = new Set();

/* ---------- helpers ---------- */
const ring = (p, label) => { const r = 42, c = 2 * Math.PI * r; return `<svg viewBox="0 0 100 100" width="110" height="110" role="img" aria-label="${esc(label)} ${p}%"><circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--line)" stroke-width="10"/><circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--primary)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${c * p / 100} ${c}" transform="rotate(-90 50 50)"/><text x="50" y="56" text-anchor="middle" font-size="22" font-weight="800" fill="var(--text)">${p}%</text></svg>`; };
const prog = (n, label) => `<div class="bar" role="progressbar" aria-label="${esc(label || "progress")}" aria-valuenow="${n}" aria-valuemin="0" aria-valuemax="100"><i style="width:${Math.max(0, Math.min(100, n))}%"></i></div>`;
let toastT; const toast = m => { const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 2200); };
async function copy(text) { try { await navigator.clipboard.writeText(text); toast("Copied. Paste it into Forge."); } catch (e) { $("#dlgt").value = text; try { $("#dlg").showModal(); } catch (e2) { $("#dlg").setAttribute("open", ""); } $("#dlgt").select(); } }
$("#dlgx").addEventListener("click", () => { try { $("#dlg").close(); } catch (e) { $("#dlg").removeAttribute("open"); } });

/* ---------- views ---------- */
function vProject() {
  const sc = C.scope || {};
  return `
  <div class="grid">
    <div class="card"><h2>Goal</h2><p>${val(P.goal)}</p><h3>Problem</h3><p>${val(C.problem)}</p><h3>Users</h3><p>${val(C.users)}</p></div>
    <div class="card" style="text-align:center"><h2>Build progress</h2>${ring(pct, "Build progress")}<p class="muted">${phases.filter(p => p.status === "done").length} of ${phases.length} phases done</p></div>
    <div class="card" style="text-align:center"><h2>Hub completeness</h2>${ring(completeness, "Completeness")}<p class="muted">${gaps.filter(g => !isDecided(g)).length} open gaps</p><button class="btn pri sm" data-go="Gaps">Open the gap page</button></div>
  </div>
  <div class="grid">
    <div class="card"><h2>In scope</h2>${bullets(sc.in)}</div>
    <div class="card"><h2>Out of scope</h2>${bullets(sc.out)}</div>
    <div class="card"><h2>Constraints</h2>${bullets(C.constraints)}</div>
    <div class="card"><h2>Assumptions</h2>${bullets(C.assumptions)}</div>
  </div>
  <div class="grid">
    <div class="card"><h2>Stack</h2>${chips(P.stack)}</div>
    <div class="card"><h2>People</h2>${arr(C.stakeholders).length ? `<ul class="plain">${C.stakeholders.map(s => `<li><b>${esc(s.name)}</b> <span class="muted">${esc(s.role)}</span></li>`).join("")}</ul>` : TODO}</div>
    <div class="card"><h2>Next steps</h2>${arr(D.next).length ? `<ol>${D.next.map(n => `<li>${esc(n)}</li>`).join("")}</ol>` : TODO}${D.resume ? `<p class="muted"><b>Resume:</b> ${esc(D.resume)}</p>` : ""}</div>
    <div class="card"><h2>Links</h2>${arr(P.links).length ? `<ul>${P.links.map(l => `<li><a href="${safeUrl(l.url)}" target="_blank" rel="noopener">${esc(l.label || l.url)}</a></li>`).join("")}</ul>` : TODO}</div>
  </div>`;
}

const TRACK_DEFAULT = { hardware: "H", firmware: "F", backend: "B", frontend: "UI", other: "+" };
function vTracks() {
  if (!tracks.length) return `<div class="card"><h2>Dev tracks</h2><p>${TODO}</p><p class="muted">Hardware, firmware (if applicable), backend and frontend appear here once they are defined. See the Gaps page.</p></div>`;
  return `<div class="grid">${tracks.map(t => {
    const items = arr(t.items), done = items.filter(i => i.status === "done").length, n = items.length ? Math.round(done / items.length * 100) : 0, off = t.applicable === false;
    return `<div class="card tcard ${off ? "off" : ""}"><div class="row"><h2><span class="tracktag">${esc(TRACK_DEFAULT[t.key] || TRACK_DEFAULT.other)}</span>${esc(t.title || t.key)}</h2>${off ? badge("not applicable") : badge(t.status || "todo")}</div>
      ${off ? '<p class="muted">Marked not applicable for this project.</p>' : `<p>${val(t.summary)}</p>${prog(n, t.title)}<p class="muted">${done} of ${items.length} items done${t.owner ? " · owner " + esc(t.owner) : ""}</p>
      <ul class="plain">${items.map(i => `<li><span class="dot ${esc(i.status)}"></span>${esc(i.t)}${i.note ? ` <span class="muted">(${esc(i.note)})</span>` : ""}</li>`).join("")}</ul>
      <p>${chips(t.stack)}</p>`}</div>`;
  }).join("")}</div>`;
}

function vPlan() {
  const col = (k, label) => `<div class="col"><h3>${label} (${actions.filter(a => (a.status || "todo") === k).length})</h3>${actions.filter(a => (a.status || "todo") === k).map(a => `<div class="ticket ${esc(a.priority || "medium")}"><b>${esc(a.a)}</b><div class="muted">${[a.track, a.owner, a.due].filter(Boolean).map(esc).join(" · ")}</div></div>`).join("") || '<span class="todo">empty</span>'}</div>`;
  return `
  <div class="card"><h2>Dev plan: roadmap</h2>${phases.length ? `<ol class="timeline">${phases.map(p => `<li class="${esc(p.status)}"><div class="row"><b>${esc(p.name)}</b>${badge(p.status || "todo")}</div><div class="muted">${esc([p.start, p.end].filter(Boolean).join(" to "))}</div>${prog(p.status === "done" ? 100 : +p.progress || 0, p.name)}<ul class="tasks">${arr(p.tasks).map(t => `<li class="${t.done ? "done" : ""}">${t.done ? "&#10003; " : "&#9675; "}${esc(t.t)}</li>`).join("")}</ul></li>`).join("")}</ol>` : `<p>${TODO}</p>`}</div>
  <div class="card"><h2>Action plan</h2>${actions.length ? `<div class="board">${col("todo", "To do")}${col("doing", "Doing")}${col("done", "Done")}</div>` : `<p>${TODO}</p>`}</div>
  <div class="grid">
    <div class="card"><h2>Risks</h2>${arr(D.risks).length ? `<table><tr><th>Risk</th><th>Level</th><th>Mitigation</th></tr>${D.risks.map(r => `<tr><td>${esc(r.r)}</td><td>${badge(r.level || "medium")}</td><td>${esc(r.mitigation)}</td></tr>`).join("")}</table>` : `<p>${TODO}</p>`}</div>
    <div class="card"><h2>Decisions</h2>${arr(D.decisions).length ? `<table><tr><th>Decision</th><th>Why</th><th>Date</th></tr>${D.decisions.map(d => `<tr><td>${esc(d.d)}</td><td>${esc(d.why)}</td><td class="num">${esc(d.date)}</td></tr>`).join("")}</table>` : `<p>${TODO}</p>`}</div>
  </div>`;
}

function vBusiness() {
  const totalCost = arr(B.costs).reduce((a, c) => a + (+c.amount || 0), 0), totalOffer = arr(B.offer).reduce((a, o) => a + (+o.price || 0), 0);
  return `
  <div class="grid">
    <div class="card"><h2>Audience</h2><p>${val(B.audience)}</p></div>
    <div class="card"><h2>Value proposition</h2><p>${val(B.value)}</p></div>
    <div class="card"><h2>Revenue model</h2><p>${val(B.model)}</p></div>
  </div>
  <div class="grid">
    <div class="card"><h2>Offer and pricing</h2>${arr(B.offer).length ? `<table>${B.offer.map(o => `<tr><td>${esc(o.item)}<div class="muted">${esc(o.note)}</div></td><td class="num">${money(o.price)}</td></tr>`).join("")}<tr><td><b>Total</b></td><td class="num"><b>${money(totalOffer || null)}</b></td></tr></table>` : `<p>${TODO}</p>`}</div>
    <div class="card"><h2>Costs</h2>${arr(B.costs).length ? `<table>${B.costs.map(c => `<tr><td>${esc(c.item)}</td><td class="num">${money(c.amount)}</td></tr>`).join("")}<tr><td><b>Total</b></td><td class="num"><b>${money(totalCost || null)}</b></td></tr></table>` : `<p>${TODO}</p>`}</div>
    ${totalOffer || totalCost ? `<div class="card"><h2>Margin</h2><div class="kpi">${money(totalOffer - totalCost)}</div><p class="muted">offer minus costs, from the figures entered</p>${prog(totalOffer ? Math.round((totalOffer - totalCost) / totalOffer * 100) : 0, "margin")}</div>` : ""}
  </div>
  <div class="grid">
    <div class="card"><h2>KPIs</h2>${arr(B.kpis).length ? `<table><tr><th>KPI</th><th>Target</th><th>Now</th></tr>${B.kpis.map(k => `<tr><td>${esc(k.k)}</td><td>${val(k.target)}</td><td>${val(k.now)}</td></tr>`).join("")}</table>` : `<p>${TODO}</p>`}</div>
    <div class="card"><h2>Milestones</h2>${arr(B.milestones).length ? `<ol class="timeline">${B.milestones.map(m => `<li><b>${esc(m.m)}</b> <span class="muted">${esc(m.date)}</span></li>`).join("")}</ol>` : `<p>${TODO}</p>`}</div>
  </div>
  ${B.notes ? `<div class="card"><h2>Notes</h2><p>${esc(B.notes)}</p></div>` : ""}`;
}

const FORGE_ROLE = {
  role: "Dev agent of the REF framework. Plans, builds, verifies and documents this project in native HTML, CSS and JavaScript first, and asks before adding anything else.",
  does: ["Reads the project context file once per session and keeps it current", "Picks one or two skills per step from a routing table instead of loading everything", "Builds with the smallest change that solves the request, then validates it", "Reports every skill used, with the reason, and tokens only when they are shown", "Keeps this hub current: plan, tracks, business plan, agent page and gaps", "Asks before adding frameworks, libraries, paid assets or Unity"],
  wont: ["Invent facts, prices, tests or results", "Add dependencies or switch stack without permission", "Re-read files or skills it already read", "Touch unrelated files or expose secrets"],
  commands: [["/forge:start", "Load the rules, check the context file and the hub"], ["/forge:context", "Create, migrate or update the context file"], ["/forge:hub", "Create or refresh this hub"], ["/forge:report", "Skills used, tokens, plan, improvements"], ["/forge:improve", "End-of-day self-improvement from the session"]]
};
function vAgent() {
  const used = new Map(arr(A.usedSkills).map(u => typeof u === "string" ? [u, ""] : [u.name, u.why || ""]));
  const total = FORGE.groups.reduce((n, g) => n + g.skills.length, 0);
  const role = { ...FORGE_ROLE, ...A };
  return `
  <div class="grid">
    <div class="card"><h2>${esc(A.name || "Forge")} ${badge(A.version || FORGE.version || "")}</h2><p>${esc(role.role)}</p></div>
    <div class="card"><h2>Responsibilities</h2>${bullets(role.does)}</div>
    <div class="card"><h2>Will not</h2>${bullets(role.wont)}</div>
  </div>
  <div class="grid">
    <div class="card"><h2>Commands</h2><table>${role.commands.map(c => `<tr><td><code>${esc(c[0])}</code></td><td>${esc(c[1])}</td></tr>`).join("")}</table></div>
    <div class="card"><h2>Used in this project</h2>${used.size ? `<ul class="plain">${[...used].map(([n, w]) => `<li><span class="badge used">${esc(n)}</span> <span class="muted">${esc(w)}</span></li>`).join("")}</ul>` : '<p class="todo">No skills recorded yet. Forge adds them after each piece of work.</p>'}${A.notes ? `<p class="muted">${esc(A.notes)}</p>` : ""}</div>
  </div>
  <div class="card"><div class="row"><h2>Skill catalog</h2><span class="muted">${used.size} used of ${total}</span></div><input type="search" id="skq" placeholder="Filter skills" aria-label="Filter skills">
    <div id="skl">${FORGE.groups.map(g => `<h3 style="margin-top:14px">${esc(g.g)}</h3>${g.skills.map(s => `<div class="sk ${used.has(s[0]) ? "used" : ""}" data-t="${esc((s[0] + " " + s[1]).toLowerCase())}"><code>${esc(s[0])}</code><span>${esc(s[1])}</span></div>`).join("")}`).join("") || '<p class="todo">Skill catalog not generated.</p>'}</div></div>`;
}

function gapPrompt(g) {
  const o = arr(g.options).map((x, i) => `- ${String.fromCharCode(65 + i)}: ${x.label}${x.note ? " (" + x.note + ")" : ""}`).join("\n");
  return `Forge, help me close project gap ${g.id} (${g.area}): ${g.question}\n${g.why ? "Why it matters: " + g.why + "\n" : ""}${o ? "Options:\n" + o + "\n" : ""}Give a short recommendation with trade-offs for this project, then wait for my choice. When I decide, record it in the context file (section 7) and update the hub.`;
}
function vGaps() {
  const open = gaps.filter(g => !isDecided(g)), blockers = open.filter(g => g.priority === "blocker").length;
  const list = gaps.filter(g => gapFilter === "all" || (gapFilter === "open" && (!isDecided(g) || touched.has(g.id))) || (gapFilter === "blocker" && g.priority === "blocker" && (!isDecided(g) || touched.has(g.id))) || (gapFilter === "decided" && isDecided(g)));
  const f = (k, l) => `<button class="btn sm" data-f="${k}" aria-pressed="${gapFilter === k}">${l}</button>`;
  return `
  <div class="card"><div class="row"><h2>Gaps to fill and decide</h2><button class="btn pri" data-all="1">Copy all decisions for Forge</button></div>
    <p class="muted">${gaps.length - open.length} of ${gaps.length} closed · ${blockers} blocking. Pick an option or type your own answer, then copy the decisions into Forge. Your picks are kept in this browser only; Forge writes them into the project when you paste them.</p>
    ${prog(gaps.length ? Math.round((gaps.length - open.length) / gaps.length * 100) : 100, "Gaps closed")}
    <div class="filters">${f("open", "Open (" + open.length + ")")}${f("blocker", "Blocking (" + blockers + ")")}${f("decided", "Decided (" + (gaps.length - open.length) + ")")}${f("all", "All")}</div></div>
  ${list.map(g => { const s = st[g.id] || {}, dec = decisionOf(g); return `
  <div class="card gap ${esc(g.priority || "important")} ${dec ? "decided" : ""}" style="margin-top:16px"><div class="row"><span><span class="badge">${esc(g.id)}</span> <span class="badge">${esc(g.area)}</span> ${badge(g.priority || "important")}${g.auto ? " " + badge("missing info") : ""}</span>${dec ? badge("decided") : badge("open")}</div>
    <h3 style="margin-top:10px">${esc(g.question)}</h3>${g.why ? `<p class="muted">${esc(g.why)}</p>` : ""}
    ${arr(g.options).length ? `<div class="opts">${g.options.map((o, i) => `<button class="opt" data-g="${esc(g.id)}" data-i="${i}" aria-pressed="${s.choice === i || (s.choice == null && !s.text && g.status === "decided" && g.decision === o.label)}">${o.recommended ? '<span class="rec">Recommended</span>' : ""}<b>${String.fromCharCode(65 + i)}. ${esc(o.label)}</b><small>${esc(o.note)}</small></button>`).join("")}</div>` : ""}
    <label class="muted" for="in-${esc(g.id)}">${arr(g.options).length ? "Or your own answer" : "Your answer"}</label><input type="text" id="in-${esc(g.id)}" data-t="${esc(g.id)}" value="${esc(s.text || "")}" placeholder="Type a decision or a fact">
    ${dec ? `<p><b>Decision:</b> ${esc(dec)}</p>` : ""}
    <p><button class="btn sm pri" data-ask="${esc(g.id)}">Ask Forge about this</button> <button class="btn sm" data-clear="${esc(g.id)}">Clear my pick</button></p></div>`; }).join("") || '<div class="card" style="margin-top:16px"><p>Nothing in this view.</p></div>'}`;
}

function vIdentity() {
  return `
  <div class="card"><h2>Palette</h2>${arr(I.palette).length ? `<div class="sw">${I.palette.map(c => `<div><b style="background:${safeColor(c.hex) || "transparent"}"></b><strong>${esc(c.name)}</strong><small>${esc(c.hex)} ${esc(c.role)}</small></div>`).join("")}</div>` : `<p>${TODO}</p>`}</div>
  <div class="grid">
    <div class="card"><h2>Typography</h2><p>Headings: ${val(I.fonts && I.fonts.heading)}</p><p>Body: ${val(I.fonts && I.fonts.body)}</p></div>
    <div class="card"><h2>Tone</h2>${chips(I.tone)}</div>
    <div class="card"><h2>References</h2>${arr(I.references).length ? `<ul>${I.references.map(r => `<li>${/^https?:\/\//i.test(r) ? `<a href="${safeUrl(r)}" target="_blank" rel="noopener">${esc(r)}</a>` : esc(r)}</li>`).join("")}</ul>` : TODO}</div>
  </div>`;
}

/* ---------- shell ---------- */
const views = [["Project", vProject], ["Tracks", vTracks], ["Plan", vPlan], ["Business", vBusiness], ["Agent", vAgent], ["Gaps", vGaps], ["Identity", vIdentity]];
const openCount = () => gaps.filter(g => !isDecided(g)).length;
const tabsHtml = () => views.map(([n], i) => `<button role="tab" id="t${i}" aria-selected="${i === cur}" aria-controls="p${i}">${n}${n === "Gaps" && openCount() ? `<span class="n">${openCount()}</span>` : ""}</button>`).join("") + '<button class="theme" id="theme" aria-label="Toggle dark mode">Light / Dark</button>';
let cur = 0;
$("#main").innerHTML = views.map(([n, f], i) => `<section class="panel" role="tabpanel" id="p${i}" aria-labelledby="t${i}" ${i ? "hidden" : ""}>${f()}</section>`).join("");
const gi = views.findIndex(v => v[0] === "Gaps");
function show(i) { cur = i; $("#tabs").innerHTML = tabsHtml(); views.forEach((_, k) => { $("#p" + k).hidden = k !== i; }); window.scrollTo(0, 0); }
function refreshGaps() { $("#p" + gi).innerHTML = vGaps(); const y = window.scrollY; $("#tabs").innerHTML = tabsHtml(); window.scrollTo(0, y); }
$("#tabs").innerHTML = tabsHtml();
$("#tabs").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; if (b.id === "theme") { const dark = matchMedia("(prefers-color-scheme:dark)").matches; const c = document.documentElement.dataset.theme || (dark ? "dark" : "light"); document.documentElement.dataset.theme = c === "dark" ? "light" : "dark"; } else if (b.role === "tab" || b.getAttribute("role") === "tab") show(+b.id.slice(1)); });
$("#main").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return; const d = b.dataset;
  if (d.go) show(views.findIndex(v => v[0] === d.go));
  else if (d.f) { gapFilter = d.f; touched.clear(); refreshGaps(); }
  else if (d.g != null && d.i != null) { const s = st[d.g] || (st[d.g] = {}); s.choice = s.choice === +d.i ? null : +d.i; s.text = ""; touched.add(d.g); save(); refreshGaps(); }
  else if (d.clear) { delete st[d.clear]; touched.add(d.clear); save(); refreshGaps(); }
  else if (d.ask) copy(gapPrompt(gaps.find(g => g.id === d.ask)));
  else if (d.all) { const done = gaps.filter(isDecided); if (!done.length) { toast("No decisions yet."); return; } copy("Forge, record these project decisions in the context file (section 7) and update the hub (gaps to decided, plan and business fields they affect):\n" + done.map(g => `- ${g.id} (${g.area}) ${g.question} -> ${decisionOf(g)}`).join("\n")); }
});
$("#main").addEventListener("change", e => { const t = e.target; if (t.dataset && t.dataset.t) { const s = st[t.dataset.t] || (st[t.dataset.t] = {}); s.text = t.value.trim(); if (s.text) s.choice = null; touched.add(t.dataset.t); save(); refreshGaps(); } });
$("#main").addEventListener("input", e => { if (e.target.id === "skq") { const q = e.target.value.toLowerCase(); document.querySelectorAll("#skl .sk").forEach(r => { r.hidden = !!q && !r.dataset.t.includes(q); }); } });
$("#foot").textContent = "Generated by Forge from REF/CONTEXT/001_PROJECT_CONTEXT.md, which stays the source of truth. Empty fields are left empty on purpose.";
</script>
</body>
</html>
