<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Project Hub</title>
<style>
/* Forge Project Hub. Static page: never edit it per project. Project content lives in hub-data.js. */
:root{--primary:#4f46e5;--accent:#f59e0b;--bg:#f6f7fb;--card:#fff;--text:#161a2b;--muted:#5d647a;--line:#e3e6f0;--ok:#16a34a;--warn:#d97706;--bad:#dc2626;--ok-t:#166534;--warn-t:#92400e;--bad-t:#991b1b;--sig:#1d4ed8;--fill:var(--primary);--pt:color-mix(in srgb,var(--primary) 55%,var(--text));--r:14px}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0e1020;--card:#171a30;--text:#eceefb;--muted:#9aa1bd;--line:#272b49;--ok-t:#86efac;--warn-t:#fcd34d;--bad-t:#fca5a5;--sig:#93c5fd;color-scheme:dark}}
:root[data-theme=dark]{--bg:#0e1020;--card:#171a30;--text:#eceefb;--muted:#9aa1bd;--line:#272b49;--ok-t:#86efac;--warn-t:#fcd34d;--bad-t:#fca5a5;--sig:#93c5fd;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1140px;margin:0 auto;padding:0 16px 48px}
header.hero{background:linear-gradient(rgba(0,0,0,.25),rgba(0,0,0,.25)),linear-gradient(135deg,var(--primary),color-mix(in srgb,var(--primary) 55%,var(--accent)));color:#fff;padding:30px 0 26px}
.hero h1{margin:0 0 4px;font-size:clamp(1.6rem,4vw,2.4rem);line-height:1.15}
.hero p{margin:0;opacity:.92;max-width:62ch}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);border-radius:99px;padding:3px 12px;font-size:.82rem}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;gap:4px;overflow-x:auto;padding:8px 16px;margin:0 -16px 20px}
nav.tabs button{border:0;background:none;color:var(--muted);font:inherit;font-weight:600;padding:8px 14px;border-radius:99px;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected=true]{background:var(--fill);color:#fff}
nav.tabs .n{display:inline-block;min-width:20px;margin-left:6px;padding:0 6px;border-radius:99px;background:var(--bad);color:#fff;font-size:.72rem;line-height:20px;text-align:center}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.theme{margin-left:auto;border:1px solid var(--line)!important;background:var(--card)!important;color:var(--text)!important}
section.panel[hidden]{display:none}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.grid+.grid,.card+.grid,.grid+.card{margin-top:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card h2,.card h3{margin:0 0 10px;font-size:1.05rem}
.muted{color:var(--muted)}
.kpi{font-size:2rem;font-weight:800;line-height:1}
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--primary),var(--accent));border-radius:99px}
.row{display:flex;justify-content:space-between;gap:12px;align-items:baseline;flex-wrap:wrap}
.badge{display:inline-block;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 9px;border-radius:99px;background:var(--line);color:var(--muted)}
.badge.done,.badge.low,.badge.nice{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok-t)}
.badge.doing,.badge.medium,.badge.important{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn-t)}
.badge.high,.badge.blocker{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad-t)}
.badge.used{background:color-mix(in srgb,var(--primary) 20%,transparent);color:var(--pt)}
.timeline{position:relative;margin:0;padding:0 0 0 22px;list-style:none;border-left:3px solid var(--line)}
.timeline li{position:relative;margin:0 0 18px}
.timeline li::before{content:"";position:absolute;left:-30px;top:6px;width:13px;height:13px;border-radius:50%;background:var(--line);border:3px solid var(--bg)}
.timeline li.done::before{background:var(--ok)}.timeline li.doing::before{background:var(--accent)}
ul.tasks,ul.plain{list-style:none;margin:8px 0 0;padding:0}
ul.tasks li{padding:2px 0}ul.tasks li.done{color:var(--muted);text-decoration:line-through}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--line);margin-right:8px}
.dot.done{background:var(--ok)}.dot.doing{background:var(--accent)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.78rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
th.num,td.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.sw{display:flex;gap:12px;flex-wrap:wrap}.sw div{width:104px}.sw b{display:block;height:56px;border-radius:10px;border:1px solid var(--line)}.sw small{display:block;color:var(--muted)}
.tbd{color:var(--muted);font-style:italic}
a{color:var(--pt)}
.btn{border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit;font-weight:600;padding:8px 14px;border-radius:10px;cursor:pointer}
.btn.pri{background:var(--fill);border-color:var(--fill);color:#fff}
.btn.sm{padding:5px 10px;font-size:.85rem}
.board{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}
.col{background:color-mix(in srgb,var(--line) 40%,transparent);border-radius:var(--r);padding:12px}
.col h3{margin:0 0 10px;font-size:.9rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.ticket{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px}
.ticket.high{border-left-color:var(--bad)}.ticket.medium{border-left-color:var(--warn)}.ticket.low{border-left-color:var(--ok)}
.tracktag{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:10px;color:#fff;font-weight:800;margin-right:10px;background:var(--fill)}
.tcard.off{opacity:.55}
.dgw{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:6px}
.dgw svg{display:block;margin:0 auto;height:auto}
.dg-box{fill:var(--card);stroke:var(--muted);stroke-width:1.4}.dg-box.planned{stroke-dasharray:6 4}
.dg-lane{fill:color-mix(in srgb,var(--line) 32%,transparent)}
.dg-lh{fill:var(--muted);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.dg-t{fill:var(--text);font-size:13px;font-weight:700}.dg-s{fill:var(--muted);font-size:11px}.dg-p{fill:var(--text);font-size:11px}
.dg-pin{fill:var(--card);stroke:var(--muted);stroke-width:1.4}
.dg-e{fill:none;stroke-width:1.8}.dg-e.data{stroke:var(--pt)}.dg-e.power{stroke:var(--bad-t)}.dg-e.signal{stroke:var(--sig)}.dg-e.control{stroke:var(--muted);stroke-dasharray:5 4}
.dg-m{fill:var(--muted);font-size:10.5px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.dg-z{fill:none;stroke:var(--muted);stroke-width:1.2;opacity:.8}.dg-z.dash{stroke-dasharray:6 5}.dg-zl{fill:var(--muted);font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase}
.dg-l{fill:var(--text);font-size:10.5px}.dg-lb{fill:var(--card);stroke:var(--line)}
.dglegend{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0 0;font-size:.85rem;color:var(--muted)}
.dglegend i{display:inline-block;width:26px;height:0;border-top:3px solid;vertical-align:middle;margin-right:6px}
details.alt{margin-top:8px}details.alt summary{cursor:pointer;color:var(--pt);font-weight:600}
.layers{display:grid;gap:8px}.layer{display:flex;gap:14px;flex-wrap:wrap;align-items:center;border:1px solid var(--line);border-left:6px solid var(--c);border-radius:12px;padding:10px 14px;background:var(--bg)}
.lname{min-width:190px;display:grid}.litems{display:flex;gap:8px;flex-wrap:wrap}.lit{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:3px 10px;font-size:.9rem}
.bar.warn>i{background:var(--warn)}.bar.bad>i{background:var(--bad)}
.badge.proposed{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn-t)}
.badge.built,.badge.decided{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok-t)}
.ph{margin:24px 0 12px;font-size:1.2rem}.part+.part{margin-top:8px}
.m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.85rem}
.badge.blocked,.badge.outdated,.badge.missing{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad-t)}
.badge.approved{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok-t)}
.badge.review{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn-t)}
.dot.blocked{background:var(--bad)}
.tw{overflow-x:auto}.tw table{min-width:640px}.tw.s table{min-width:0}.meta{display:none;color:var(--muted);font-size:.85rem}
tr.s-done td{color:var(--muted)}tr.s-done td b{font-weight:600;text-decoration:line-through}
td.over,.over{color:var(--bad-t);font-weight:700}
.stat{display:grid;gap:2px}.stat .kpi small{font-size:1rem;font-weight:600;color:var(--muted)}
.wl{display:grid;grid-template-columns:90px 1fr 56px;gap:10px;align-items:center;margin:8px 0}
.wlb{height:12px;background:color-mix(in srgb,var(--primary) 22%,var(--line));border-radius:99px;overflow:hidden}
.wlb>i{display:block;height:100%;background:var(--primary)}
.seg{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:4px 0 14px}
.seg .btn[aria-pressed=true]{background:var(--text);color:var(--bg);border-color:var(--text)}
.seg label{color:var(--muted);font-size:.85rem;font-weight:600}
.next li{padding:6px 0;border-bottom:1px solid var(--line)}
.doc{display:grid;grid-template-columns:52px 1fr auto auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.doc[hidden],.dg[hidden]{display:none}
.doc.missing{border:2px dashed var(--line);border-radius:12px;padding:10px 12px;margin:6px 0}
.ftype{display:grid;place-items:center;height:36px;border-radius:8px;background:color-mix(in srgb,var(--primary) 14%,var(--card));color:var(--pt);font-size:.7rem;font-weight:800;letter-spacing:.04em}
.doc code{font-size:.8rem;color:var(--muted);word-break:break-all}
@media (max-width:600px){
.tw table.tasks{min-width:0}.tasks tr:first-child{display:none}
.tasks tr{display:grid;grid-template-columns:14px 1fr auto;gap:0 10px;align-items:start;padding:10px 0;border-bottom:1px solid var(--line)}
.tasks td{border:0;padding:0;text-align:left}.tasks .c-id,.tasks .c-own,.tasks .c-due,.tasks .c-est,.tasks .c-sp{display:none}.tasks .meta{display:block}
.doc{grid-template-columns:44px 1fr}.doc>:nth-child(n+3){grid-column:2}.wl{grid-template-columns:70px 1fr 46px}}
.gap{border-left:5px solid var(--line)}.gap.blocker{border-left-color:var(--bad)}.gap.important{border-left-color:var(--warn)}.gap.nice{border-left-color:var(--ok)}.gap.decided{border-left-color:var(--primary)}
.opts{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin:12px 0}
.opt{text-align:left;border:2px solid var(--line);background:var(--bg);color:var(--text);font:inherit;border-radius:12px;padding:10px 12px;cursor:pointer}
.opt[aria-pressed=true]{border-color:var(--primary);background:color-mix(in srgb,var(--primary) 12%,var(--card))}
.opt b{display:block}.opt small{color:var(--muted)}
.opt .rec{float:right;font-size:.7rem;font-weight:700;color:var(--ok-t);text-transform:uppercase}
input[type=text],input[type=search]{width:100%;font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.filters .btn[aria-pressed=true]{background:var(--text);color:var(--bg);border-color:var(--text)}
.sk{display:flex;gap:10px;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}
.sk code{font-weight:700;white-space:nowrap}.sk span{color:var(--muted);font-size:.9rem}
.sk.used code{color:var(--pt)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
dialog{border:1px solid var(--line);border-radius:var(--r);background:var(--card);color:var(--text);max-width:640px;width:calc(100% - 32px)}
dialog textarea{width:100%;font:inherit;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:8px}
footer{margin-top:28px;color:var(--muted);font-size:.85rem}
ul.tree,ul.tree ul{list-style:none;margin:0;padding-left:18px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.88rem}ul.tree{padding-left:0}
ul.tree li{padding:2px 0}ul.tree summary{cursor:pointer}ul.tree .tf::before{content:"· ";color:var(--muted)}
.stack{display:flex;height:16px;border-radius:99px;overflow:hidden;background:var(--line)}.stack i{display:block;height:100%}
.leg{display:flex;gap:6px 14px;flex-wrap:wrap;margin:8px 0 0;font-size:.85rem;color:var(--muted)}.leg b{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:baseline}
.assets{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));margin-top:10px}
.asset{display:grid;grid-template-columns:44px 1fr;gap:4px 12px;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--bg)}.asset.missing{border-style:dashed}
.asset .ftype{height:44px;grid-row:span 2}.asset code{font-size:.78rem;color:var(--muted);word-break:break-all}
.bars{display:grid;grid-template-columns:minmax(80px,150px) 1fr 36px;gap:6px 10px;align-items:center;margin:6px 0}.bars span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bars b{text-align:right}
.badge.passing{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok-t)}.badge.failing{background:color-mix(in srgb,var(--bad) 18%,transparent);color:var(--bad-t)}
.role{border-left:4px solid var(--primary);padding:2px 0 2px 12px;margin:10px 0}
@media (max-width:600px){.hero{padding:22px 0}.kpi{font-size:1.6rem}.bars{grid-template-columns:90px 1fr 30px}}
@media print{nav.tabs,.theme,.btn,.filters{display:none}section.panel[hidden]{display:block}.card{break-inside:avoid}}
</style>
</head>

if (typeof HUB === "undefined") { document.body.innerHTML = '<p style="padding:24px;font:16px system-ui">hub-data.js was not found next to this page. Keep both files together, or use the single-file version.</p>'; throw new Error("HUB missing"); }

const $ = (s, r = document) => r.querySelector(s);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const TODO = '<span class="tbd">to define</span>';
const val = v => (v === "" || v == null) ? TODO : esc(v);

    <p class="muted">${gaps.length - open.length} of ${gaps.length} closed · ${blockers} blocking. Pick an option or type your own answer, then copy the decisions into Forge. Your picks are kept in this browser only; Forge writes them into the project when you paste them.</p>
    ${prog(gaps.length ? Math.round((gaps.length - open.length) / gaps.length * 100) : 100, "Gaps closed")}
    <div class="filters">${f("open", "Open (" + open.length + ")")}${f("blocker", "Blocking (" + blockers + ")")}${f("decided", "Decided (" + (gaps.length - open.length) + ")")}${f("all", "All")}</div></div>
  ${list.map(g => { const s = st[g.id] || {}, dec = decisionOf(g); return `
  <div class="card gap ${esc(g.priority || "important")} ${dec ? "decided" : ""}" style="margin-top:16px"><div class="row"><span><span class="badge">${esc(g.id)}</span> <span class="badge">${esc(g.area)}</span> ${badge(g.priority || "important")}${g.auto ? " " + badge("missing info") : ""}</span>${dec ? badge("decided") : badge("open")}</div>
    <h3 style="margin-top:10px">${esc(g.question)}</h3>${g.why ? `<p class="muted">${esc(g.why)}</p>` : ""}
    ${arr(g.options).length ? `<div class="opts">${g.options.map((o, i) => `<button class="opt" data-g="${esc(g.id)}" data-i="${i}" aria-pressed="${s.choice === i || (s.choice == null && !s.text && g.status === "decided" && g.decision === o.label)}">${o.recommended ? '<span class="rec">Recommended</span>' : ""}<b>${String.fromCharCode(65 + i)}. ${esc(o.label)}</b><small>${esc(o.note)}</small></button>`).join("")}</div>` : ""}
    <label class="muted" for="in-${esc(g.id)}">${arr(g.options).length ? "Or your own answer" : "Your answer"}</label><input type="text" id="in-${esc(g.id)}" data-t="${esc(g.id)}" value="${esc(s.text || "")}" placeholder="Type a decision or a fact">
    ${dec ? `<p><b>Decision:</b> ${esc(dec)}</p>` : ""}
    <p><button class="btn sm pri" data-ask="${esc(g.id)}">Ask Forge about this</button> <button class="btn sm" data-clear="${esc(g.id)}">Clear my pick</button></p></div>`; }).join("") || '<div class="card" style="margin-top:16px"><p>Nothing in this view.</p></div>'}`;
}

function vIdentity() {
  return `
  <div class="card"><h2>Palette</h2>${arr(I.palette).length ? `<div class="sw">${I.palette.map(c => `<div><b style="background:${safeColor(c.hex) || "transparent"}"></b><strong>${esc(c.name)}</strong><small>${esc(c.hex)} ${esc(c.role)}</small></div>`).join("")}</div>` : `<p>${TODO}</p>`}</div>
  <div class="grid">
    <div class="card"><h2>Typography</h2><p>Headings: ${val(I.fonts && I.fonts.heading)}</p><p>Body: ${val(I.fonts && I.fonts.body)}</p></div>
    <div class="card"><h2>Tone</h2>${chips(I.tone)}</div>
    <div class="card"><h2>Techs and tools</h2>${chips(I.tech)}</div>
    <div class="card"><h2>References</h2>${arr(I.references).length ? `<ul>${I.references.map(r => `<li>${/^https?:\/\//i.test(r) ? `<a href="${safeUrl(r)}" target="_blank" rel="noopener">${esc(r)}</a>` : esc(r)}</li>`).join("")}</ul>` : TODO}</div>
  </div>`;
}

/* ---------- shell: the tabs are generated from the project (HUB.ui.tabs overrides) ---------- */
const PARTS = { Project: vProject, Plan: vPlan, Hardware: vHardware, Software: vSoftware, Business: vBusiness, Docs: vDocs, Quality: vQuality, Agent: vAgent, Gaps: vGaps, Identity: vIdentity, Assets: vAssets, Structure: vStructure };
Object.keys(SEC).forEach(k => { PARTS[k] = () => vSection(k); });
const hasKey = ks => tracks.some(t => ks.includes(String(t.key || "").toLowerCase()) && t.applicable !== false);
const hasHW = !!(Object.keys(HW).length || diagrams.some(d => homeOf(d) === "Hardware") || hasKey(["hardware", "firmware"]));
const hasSW = !!(Object.keys(SW).length || diagrams.some(d => homeOf(d) === "Software") || hasKey(["backend", "frontend"]));
/* project type decides the middle tabs: web, mechatronics, game; anything else is picked from the data */
const apps = arr(PR.apps), hasApp = apps.length || S.app, appTab = (hasApp || hasSW) && { label: apps.length ? apps.map(a => ({ hmi: "HMI", webapp: "Web app", mobile: "Mobile app" }[a] || a[0].toUpperCase() + a.slice(1))).join(" / ") : "Software", parts: [hasApp && "App", hasSW && "Software"].filter(Boolean) };
const TYPE_TABS = {
  web: ["Frontend", "Backend", "Database", { label: "Design", parts: ["Identity", "Assets"] }],
  mechatronics: ["Firmware", "Hardware", appTab, (assets.length || libs.length) && "Assets", arr(I.palette).length && "Identity"],
  game: ["UI", "Code", "Structure", { label: "Assets", parts: ["Assets", "Identity"] }]
};
const middle = TYPE_TABS[PT] || [hasHW && "Hardware", hasSW && "Software", "Identity", (assets.length || libs.length) && "Assets"];
const spec = arr((HUB.ui || {}).tabs).length ? HUB.ui.tabs : ["Project", "Plan", ...middle, "Business", { label: "Docs and quality", parts: ["Docs", "Quality"] }, "Agent", "Gaps"].filter(Boolean);
const views = spec.map(t => typeof t === "string" ? { label: t, parts: [t] } : { label: t.label || arr(t.parts).join(" + "), parts: arr(t.parts) }).map(v => ({ ...v, parts: v.parts.filter(p => PARTS[p]) })).filter(v => v.parts.length);
if (!views.some(v => v.parts.includes("Gaps"))) views.push({ label: "Gaps", parts: ["Gaps"] });
const tabOf = part => views.findIndex(v => v.parts.includes(part));
function partShown(part) { return tabOf(part) >= 0; }
const openCount = () => gaps.filter(g => !isDecided(g)).length;
let cur = 0;
const tabsHtml = () => views.map((v, i) => `<button role="tab" id="t${i}" aria-selected="${i === cur}" aria-controls="p${i}">${esc(v.label)}${v.parts.includes("Gaps") && openCount() ? `<span class="n">${openCount()}</span>` : ""}</button>`).join("") + '<button class="theme" id="theme" aria-label="Toggle dark mode">Light / Dark</button>';
const panelHtml = v => v.parts.map(p => `<div class="part">${v.parts.length > 1 ? `<h2 class="ph">${esc(p)}</h2>` : ""}${PARTS[p]()}</div>`).join("");
/* panels are drawn when first opened (a light first load); printing draws them all */
const drawn = new Set();
function draw(i) { if (drawn.has(i)) return; drawn.add(i); $("#p" + i).innerHTML = panelHtml(views[i]); if ($("#dq")) { $("#dq").value = docQ; applyDocs(); } }
$("#main").innerHTML = views.map((v, i) => `<section class="panel" role="tabpanel" id="p${i}" aria-labelledby="t${i}" ${i ? "hidden" : ""}></section>`).join("");
draw(0);
addEventListener("beforeprint", () => views.forEach((_, i) => draw(i)));
function show(i) { if (i < 0) return; cur = i; draw(i); $("#tabs").innerHTML = tabsHtml(); views.forEach((_, k) => { $("#p" + k).hidden = k !== i; }); window.scrollTo(0, 0); }
function refreshPart(part) { const i = tabOf(part); if (i < 0) return; const y = window.scrollY; drawn.add(i); $("#p" + i).innerHTML = panelHtml(views[i]); if ($("#dq")) { $("#dq").value = docQ; applyDocs(); } $("#tabs").innerHTML = tabsHtml(); window.scrollTo(0, y); }
const refreshPlan = () => refreshPart("Plan"), refreshGaps = () => refreshPart("Gaps");
$("#tabs").innerHTML = tabsHtml();
$("#tabs").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; if (b.id === "theme") { const dark = matchMedia("(prefers-color-scheme:dark)").matches; const c = document.documentElement.dataset.theme || (dark ? "dark" : "light"); document.documentElement.dataset.theme = c === "dark" ? "light" : "dark"; } else if (b.role === "tab" || b.getAttribute("role") === "tab") show(+b.id.slice(1)); });
$("#main").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return; const d = b.dataset;
  if (d.go) show(tabOf(d.go));
  else if (d.po !== undefined) { planOwner = d.po; try { localStorage.setItem(KEY + ":me", d.po); } catch (e) { } refreshPlan(); }
  else if (d.ps) { planStatus = d.ps; refreshPlan(); }
  else if (d.pv) { planView = d.pv; refreshPlan(); }
  else if (d.cp) copy(d.cp, "Path copied.");
  else if (d.ds) { docS = d.ds; document.querySelectorAll("[data-ds]").forEach(x => x.setAttribute("aria-pressed", x.dataset.ds === docS)); applyDocs(); }
  else if (d.f) { gapFilter = d.f; touched.clear(); refreshGaps(); }
  else if (d.g != null && d.i != null) { const s = st[d.g] || (st[d.g] = {}); s.choice = s.choice === +d.i ? null : +d.i; s.text = ""; touched.add(d.g); save(); refreshGaps(); }
  else if (d.clear) { delete st[d.clear]; touched.add(d.clear); save(); refreshGaps(); }
  else if (d.ask) copy(gapPrompt(gaps.find(g => g.id === d.ask)));
  else if (d.all) { const done = gaps.filter(isDecided); if (!done.length) { toast("No decisions yet."); return; } copy("Forge, record these project decisions in the context file (section 7) and update the hub (gaps to decided, plan and business fields they affect):\n" + done.map(g => `- ${g.id} (${g.area}) ${g.question} -> ${decisionOf(g)}`).join("\n")); }
});
$("#main").addEventListener("change", e => { const t = e.target; if (t.dataset && t.dataset.t) { const s = st[t.dataset.t] || (st[t.dataset.t] = {}); s.text = t.value.trim(); if (s.text) s.choice = null; touched.add(t.dataset.t); save(); refreshGaps(); } });
$("#main").addEventListener("input", e => { if (e.target.id === "dq") { docQ = e.target.value.toLowerCase(); applyDocs(); } if (e.target.id === "skq") { const q = e.target.value.toLowerCase(); document.querySelectorAll("#skl .sk").forEach(r => { r.hidden = !!q && !r.dataset.t.includes(q); }); } });
$("#foot").textContent = "Generated by Forge from the project and REF/CONTEXT/001_PROJECT_CONTEXT.md, which stays the source of truth. Diagrams show what the project data says, marked proposed until decided. Empty fields are left empty on purpose.";
</script>
</body>
